services:
  bid:
    image: python:3.12-alpine
    entrypoint: [sh, /app/deploy/nas/start-bid.sh]
    working_dir: /app
    environment:
      BID_PROXY_BIND: ${BID_PRIVATE_ADDRESS:?}
    volumes:
      - ${BID_APP_DIR:?}:/app:ro
      - ${BID_DATA_DIR:?}:/data
      - ${BID_ENV_FILE:?}:/secrets/bid.env:ro
      - bid-deps:/deps
    networks:
      bid-private:
        ipv4_address: ${BID_PRIVATE_ADDRESS:?}
      bid-egress: {}
  gateway:
    image: nginx:alpine
    volumes:
      - ${BID_NGINX_CONFIG:?}:/etc/nginx/conf.d/default.conf:ro
      - ${BID_NGINX_KEY_FILE:?}:/run/secrets/bid-key.conf:ro
    networks:
      - bid-private
      - portal
    ports:
      - ${BID_GATEWAY_BIND:?}:18082:8082
networks:
  bid-private:
    internal: true
    ipam:
      config:
        - subnet: ${BID_PRIVATE_SUBNET:?}
  bid-egress:
    driver: bridge
  portal:
    external: true
    name: ${BID_PORTAL_NETWORK:?}
volumes:
  bid-deps:
